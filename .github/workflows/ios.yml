name: iOS validation
on:
  workflow_dispatch:
    inputs:
      runner:
        description: Standard macOS runner (Intel fallback for arm64 capacity delays)
        type: choice
        default: macos-26
        options:
          - macos-26
          - macos-26-intel
      suite:
        description: Test suite
        type: choice
        default: full
        options:
          - full
          - screen-time
          - module-gallery
          - accessibility
          - roadmap
          - daily-flows
          - daily-fasting
          - daily-guided
          - appearance
          - prayer
          - research
          - planning-calendar
defaults:
  run:
    shell: bash
permissions:
  contents: read
concurrency:
  group: mihen-ios-${{ github.ref }}-${{ inputs.runner || 'macos-26' }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ${{ inputs.runner == 'macos-26-intel' && 'macos-26-intel' || 'macos-26' }}
    # The full matrix runs nineteen end-to-end simulator flows and can exceed
    # an hour on shared macOS capacity. Focused suites remain much shorter.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Record toolchain
        run: |
          mkdir -p .build-results
          xcodebuild -version | tee .build-results/toolchain.txt
          sw_vers >> .build-results/toolchain.txt
          uname -m >> .build-results/toolchain.txt
      - name: Portable XCTest suite
        run: swift test 2>&1 | tee .build-results/core-xctest.log
      - name: Verify project
        run: python3 Scripts/verify-project.py
      - name: Build app and extensions, run selected tests
        env:
          MIHEN_TEST_SCOPE: ${{ inputs.suite || 'full' }}
        run: Scripts/validate-ios.sh 2>&1 | tee .build-results/ios.log
      - name: Export actual results and screenshots
        if: always()
        run: python3 Scripts/export-test-results.py
      - name: Preserve real simulator results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          include-hidden-files: true
          name: MIHEN-test-results
          path: |
            .build-results/*.xcresult
            .build-results/*.log
            .build-results/*.txt
            .build-results/*.json
            .build-results/attachments/
          retention-days: 7
          if-no-files-found: ignore
      - name: Preserve compact review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          include-hidden-files: true
          name: MIHEN-preview
          path: |
            .build-results/test-summary.json
            .build-results/toolchain.txt
            .build-results/accessibility-devices.json
            .build-results/attachments/*.png
            .build-results/attachments/*.json
            .build-results/attachments/*.pdf
          retention-days: 7
          if-no-files-found: ignore
